name: Daily update
on:
  schedule:
    # GitHub may start scheduled runs hours late, so there are several tries; the first one after
    # 8:00 Chicago time that finds today's update missing does the work, the rest exit at once.
    - cron: "17 13 * * *"
    - cron: "17 14 * * *"
    - cron: "17 17 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: data
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to run
        id: gate
        run: |
          today=$(TZ=America/Chicago date +%F); hour=$(TZ=America/Chicago date +%H)
          last=$(python3 -c "import json;d=json.load(open('data/items.json'));print(d.get('updated_at', d['updated'] + 'T00:00'))")
          if [ "${{ github.event_name }}" != "schedule" ]; then go=yes
          elif [ "$hour" -lt 8 ]; then go=no; echo "Before 8:00 in Chicago."
          elif [[ "$last" > "${today}T07:59" ]]; then go=no; echo "Already updated after 8:00 today ($last)."
          else go=yes; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.11"
      - name: Crawl and merge
        if: steps.gate.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python crawler/daily.py
      - name: Commit
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data
          git diff --cached --quiet || { git commit -m "Daily update $(date -u +%F)" && git pull --rebase && git push; }
