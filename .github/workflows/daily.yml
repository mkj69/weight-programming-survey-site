name: Daily update
on:
  schedule:
    - cron: "0 13 * * *"   # 08:00 in Chicago during daylight time
    - cron: "0 14 * * *"   # 08:00 in Chicago during standard time
  workflow_dispatch:
permissions:
  contents: write
concurrency: data
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Run only at 8:00 Chicago time
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=America/Chicago date +%H)" != "08" ]; then echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.11"
      - name: Crawl and merge
        if: steps.gate.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python crawler/daily.py
      - name: Commit
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data
          git diff --cached --quiet || { git commit -m "Daily update $(date -u +%F)" && git pull --rebase && git push; }
