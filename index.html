<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weight Space Reader</title>
<meta name="description" content="A collection of work on reading, writing, editing and compiling neural network weights, with an embedded reader and comments.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./">Weight Space Reader</a>
  <form class="add" id="addForm" autocomplete="off">
    <input id="addUrl" type="url" placeholder="Paste a link to add it" aria-label="Link to add">
    <button type="submit">Add</button>
  </form>
  <button class="icon" id="theme" type="button" aria-label="Toggle dark mode">◐</button>
</header>
<div class="app" id="app">
  <aside class="side">
    <div class="filters">
      <input id="q" type="search" placeholder="Search titles and authors" aria-label="Search">
      <div class="row">
        <select id="cat" aria-label="Category"><option value="">All categories</option></select>
        <select id="type" aria-label="Type"><option value="">All types</option></select>
      </div>
      <div class="row">
        <select id="tag" aria-label="Tag"><option value="">All tags</option></select>
        <select id="sort" aria-label="Sort">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="cited">Most cited</option>
        </select>
      </div>
      <label class="check"><input type="checkbox" id="starred"> Starred only</label>
      <div class="count" id="count"></div>
    </div>
    <ol class="list" id="list"></ol>
    <button class="more" id="more" type="button">Show more</button>
  </aside>
  <main class="reader" id="reader">
    <div class="empty" id="empty">
      <h1>Weight Space Reader</h1>
      <p>Papers, posts, code and discussions on reading, writing, editing and compiling neural network weights. Pick an item on the left to read it here.</p>
      <p class="muted" id="updated"></p>
    </div>
    <article id="doc" hidden>
      <div class="dochead">
        <button class="back" id="back" type="button">← List</button>
        <div class="meta">
          <h2 id="docTitle"></h2>
          <p id="docSub"></p>
          <p class="chips" id="docTags"></p>
        </div>
        <div class="actions"><a class="open" id="docOpen" target="_blank" rel="noopener">Open original ↗</a><a class="open subtle" id="docEdit" target="_blank" rel="noopener">Star or tag</a></div>
      </div>
      <div class="frame" id="frame"></div>
      <section class="comments">
        <h3>Comments</h3>
        <div id="giscus"></div>
      </section>
    </article>
  </main>
</div>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
