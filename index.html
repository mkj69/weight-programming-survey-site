const D={"readme": "# 模型权重可以被直接编程：调研\n\n主体抓取截止 2026-11-04（美国中部时间），之后补充了两轮：[11-04 至 11-07](#11-04-至-11-07-的新进展)、[11-07 至 11-09](#11-07-至-11-09-的新进展)。这个方向变化很快，下面的结论只对应这个时间点。\n\n**材料统计**：登记 341 份；有页面并完整翻译 313 份（含 95 个 X 帖子或串、14 个 HN 讨论、31 篇 arXiv 论文）；未能取得全文或没有全文收录 28 份，原因见 [INDEX.md](#list)。译文由 Codex 完成，抽查 320 句发现 1 处严重问题（已修正），详见 [QUALITY.md](#quality)。11-07 和 11-09 补充的 44 份没有参加那次抽查，我只人工看了约 15 句。\n\n**读这份调研时请注意**：除下文“核实记录”列出的几项外，我没有运行任何模型，项目中的分数都是其作者或复现者报告的数字。\n\n## 结论\n\n**这批项目实际上是两件不同的事，流传时常被混在一起。**\n\n| | A. 把程序编译进权重 | B. 让 LLM 读写权重（Weight-Space Programming） |\n|---|---|---|\n| 代表 | Tracr、Percepta、torchwright、Qwenputer、qwenFS、qwenGPU、nesformer | MIT 的 Sparks of Weight-Space Programming，以及它的复现和批评 |\n| 谁决定权重 | 人写的（或 LLM 写的）编译器，确定性计算 | 通用 LLM 推理，有时借助 Python 和前向传播 |\n| 碰不碰模型学到的东西 | 基本不碰：加维度、加层，并把电路和原模型隔开 | 碰：直接改已有权重，或从零写小网络 |\n| 主要证据 | 与参考机逐 token 对比，可以做到完全一致 | 基准分数，方差大，复现结果不一 |\n\n### 这些项目说明了什么\n\n1. **精确计算可以放进预训练模型的权重，而且不需要训练。** 原理早已有（[Tracr](papers/tracr-paper.html \"Tracr: Compiled Transformers as a Laboratory for Interpretability：中英对照全文\")、[Looped Transformers](https://arxiv.org/abs/2301.13196 \"Looped Transformers as Programmable Computers（一手）\")、2023）。新东西是 [Qwenputer](https://divagr.com/blog/qwenputer \"Qwenputer: a fully functioning, deterministic RISC-V CPU inside Qwen3.5（一手）\") 把 Gated DeltaNet 的状态变成精确可寻址的 RAM，让整台 RV32IM CPU 跑在 Qwen3.5 这样的生产模型里。\n2. **这件事已经变得便宜。** Qwenputer 公开后 2 天出现 [nesformer](https://github.com/dbreunig/nesformer/blob/main/README.md \"nesformer README（一手）\")，4 天后出现 [qwenGPU](https://github.com/vixhal-baraiya/qwenGPU/blob/main/README.md \"qwenGPU README（一手）\")，6 天后出现 [qwenFS](https://github.com/vixhal-baraiya/qwenFS/blob/main/README.md \"qwenFS README（一手）\")。nesformer 的作者[称](https://news.ycombinator.com/item?id=50306442 \"HN: Show HN nesformer (297 分)（社交）\") Opus 5.5 只用两条提示就做出了可用的权重和代码（作者自述，未核实）。\n3. **原模型已学会的行为可以当接口用。** Qwenputer 不需要再训练，靠的是 Qwen 本来就会写 tool call，电路接管这个格式并写回结果（[博客](https://divagr.com/blog/qwenputer \"Qwenputer: a fully functioning, deterministic RISC-V CPU inside Qwen3.5（一手）\")）。这是我认为最值得借鉴的工程点（我的判断）。\n4. **当前前沿 LLM 能直接处理小网络的权重，这不是单次运气。** 独立复现中，打乱权重的对照组降到偶然水平，原始组 Astra 12/12、Opus 5.5 12/12（[Alan Turing Institute 复现](https://github.com/alan-turing-institute/weights_editing/blob/main/README.md \"Replicating Sparks across LLMs README（一手）\")）。Claude Opus 5.5 在只给层大小和数字时也是 4/4（[jhpark94](https://github.com/jhpark94/weights-only-replication/blob/main/README.md \"weights-only-replication README（一手）\")）。\n5. **零交互写权重的能力是最近才出现的。** 同样提示下写 Breakout 网络，Opus 4.5 得分 3.4，GPT-5.6 Sol 得分 31.1，Astra 得分 457（[ATI](https://github.com/alan-turing-institute/weights_editing/blob/main/README.md \"Replicating Sparks across LLMs README（一手）\")，n 较小）。[Krentsel](https://x.com/AlexKrentsel/status/2117376683724660898 \"@AlexKrentsel: i've reproduced the results from the MIT blog post today on weight-spa（社交）\") 也报告了同样的阶跃。\n6. **“写权重”主要是“想出策略，再翻译成权重”。** ATI 的 F1 实验显示，同一模型写 Python 策略的分数普遍高于写权重，他们的结论是 Astra 带来的主要是从程序到权重这一步。[Xingyu Dang](https://x.com/xingyudang/status/2117428789068386630 \"@xingyudang: Ran a Writing Weights Index from today’s Weight-Space Programming post（社交）\") 独立说了同样的话。这把 A、B 两条线连了起来：**从零写权重，本质上是 LLM 在头脑里当编译器**（后半句是我的判断）。\n7. **针对单一明确故障的小编辑可以大幅改变基准分数。** 实验 8 只改 131,072 个权重，MATH-500 从 7.9% 升到 48.1%。发布的这份编辑已被多方重新评估：[Hugging Face 51.0%](https://huggingface.co/ML-Intern-lab/Qwen3.5-0.8B-weight-space-programming \"HF 模型卡：Hugging Face ML Intern 的复现（一手）\")、[OpenWSP 50.6%](https://github.com/openwsp/openwsp/blob/main/README.md \"OpenWSP README（一手）\")、[Khajavi 50.8%](https://github.com/MatinKhajavi/Weight-Space-Programming/blob/main/README.md \"replication (Khajavi) README（一手）\")。\n\n### 这些项目没有说明什么\n\n1. **没有增加模型的能力。** 实验 8 修的是思考循环：答案被截断的比例从 93.0% 降到 33.1%（[日志](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp8_math/README.md \"作者日志：exp8_math（一手）\")）。作者自己写明，在不循环的 Gemma 3 270M 上 Astra 改不动，编辑“能移除遮蔽能力的障碍，但不能增加模型没有的能力”（[博客](https://rikiyat.github.io/blog/weight-space-programming/ \"Sparks of Weight-Space Programming: LLMs can natively read & write neural network weights（一手）\")）。粗算：基础模型约 7% 的答案写完、得分 7.9%；编辑后约 67% 写完、得分 48.1%，约合 72%。写完的那部分正确率并没有上升（这是我的粗算，被截断答案也可能含 `\\boxed{}`，只能作方向参考）。\n2. **实验 8 的“发现”不是盲发现。** 我核对了[原始提示词](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp8_math/runs/p10c/turns/t001/prompt.txt)，它直接写着“if the model often fails because it repeats itself and never finishes, finding and fixing what drives that repetition counts”。这印证了 [Lucas Beyer 的批评](https://x.com/giffmana/status/2117346161866514524 \"@giffmana: This is simultaneously very cool but also a bit exaggerated. Reading t（社交）\")。Qwen 的模型卡也已警告这个问题。\n3. **过程的可复现性远低于结果的可复现性。** 发布的编辑能复现约 50%，但重新跑一遍过程差很多：[OpenWSP 用 Astra 重跑实验 8 只得 12.9%](https://github.com/openwsp/openwsp/blob/main/README.md \"OpenWSP README（一手）\")，重跑实验 4 修车是 0/1,024（作者 1,024/1,024）。作者每个任务大多只跑一次（[ATI](https://github.com/alan-turing-institute/weights_editing/blob/main/README.md \"Replicating Sparks across LLMs README（一手）\")）。反过来，[Opus 5.5 用 10 次前向传播得到 56.2%](https://github.com/MatinKhajavi/Weight-Space-Programming/blob/main/README.md \"replication (Khajavi) README（一手）\")，改法只是调几个神经元和注意力头。所以这个任务可能不难，“Astra 独有”不成立。\n4. **“natively”和“只看原始权重”的说法范围很窄。** [Honnibal 的表](https://honnibal.dev/blog/astra-read-write-misleading \"The 'Astra can read and write weights to improve Qwen' post is misleading（二手）\")显示，不用工具直接读原始权重的只有实验 1、2、4，规模 17K 到 172K。每个涉及真实语言模型的实验都用了 Python。[Goedecke](https://seangoedecke.com/llms-are-not-superhuman-at-reading-and-writing-neural-network-weights/ \"LLMs are not superhuman at reading and writing neural network weights（二手）\") 认为实验 8 就是熟练研究者会走的 abliteration 路线，[一个不用 LLM 的脚本复现](https://github.com/KidIkaros/wsp-reproduction/blob/main/README.md \"wsp-reproduction README（一手）\")也恢复了同样的机制（只有 18 道题，不是基准分）。[Neel Nanda](https://x.com/NeelNanda5/status/2117375052618539485 \"@NeelNanda5: This is a cool paper, but I think it's best thought of as Astra is sur（社交）\") 的说法是老式机制可解释性做得出乎意料地好，他不看好扩展到真实模型。\n5. **直接读大模型权重还不行。** [csinva 的受控测试](https://github.com/csinva/weight-space-programming-autoresearch/blob/main/readme.md \"weight-space-programming-autoresearch README（一手）\")：Opus 5.5 只读 Qwen3.5-0.8B 权重预测 420 个编辑的效果，相关性只比不看数字的基线高 +0.06 ± 0.02。这份证据对“读懂大模型权重”最直接，结果基本是负面的。\n6. **不是 RSI。** 编辑者和被编辑者不是同一个模型，大小差了几个数量级。作者只把 RSI 列为可能性，[Krentsel](https://x.com/AlexKrentsel/status/2117376683724660898 \"@AlexKrentsel: i've reproduced the results from the MIT blog post today on weight-spa（社交）\") 也认为当前模型做不到。目前没有任何材料展示模型改进自己后再去改进下一代。\n7. **把 CPU 放进权重并不比工具更强。** Qwenputer 的算术分数和 Python 工具基本相同，DeepMind 各组每组 40 题，NUPA 共 576 题（[README](https://github.com/divagr18/qwenputer/blob/main/README.md \"Qwenputer README（一手）\")）。它慢得多：批量执行器约 3,200 token/s，每条指令要几个 token。[nesformer](https://github.com/dbreunig/nesformer/blob/main/README.md \"nesformer README（一手）\") 比真机慢 150–290 倍。模型本身并不理解这台 CPU，也没有因此变聪明。\n8. **“文本行为不变”的证据比标题弱。** Qwenputer 的 KL 6.1e-4（噪声底 5.1e-4）只来自 [16 条提示，贪心输出 10/16 相同](https://github.com/divagr18/qwenputer/blob/main/experimental/riscv/docs/rv32.md \"experimental/riscv/docs/rv32.md（一手）\")。16 条提示是很小的样本，这个数字不能直接当基准。\n9. **Doom 的说法要分清。** [Ad1tyaNarayana](https://github.com/Ad1tyaNarayana/qwenputer-doom/blob/main/README.md \"qwenputer-doom (Ad1tyaNarayana) README（一手）\") 是一帧已核验的画面，6,342,933 个 token、50.7 分钟，用的是专用执行器，没有加载 Qwen 的语言层，不能玩。[mapestree](https://github.com/mapestree/qwenputer-doom/blob/main/README.md \"qwenputer-doom (mapestree) README（一手）\") 是 E1M1 平面图的光线投射，不是 Doom 引擎。[qwendoom](https://github.com/trymirai/qwendoom/blob/main/README.md \"qwendoom README（一手）\") 称运行游戏逻辑（README 自述，未运行验证）。\n\n\n## 主题导航\n\n完整清单见 [INDEX.md](#list)，翻译抽查见 [QUALITY.md](#quality)。\n\n### 时间线\n\n| 日期 | 事件 | 来源类型 |\n|---|---|---|\n| 1991–1993 | Schmidhuber 的 fast weight programmers、自引用权重矩阵 | [作者综述页](https://people.idsia.ch/~juergen/fast-weight-programmer-1991-transformer.html \"1991: Fast Weight Programmers / 未归一化线性 Transformer 综述页（一手）\")，其中的优先权是他本人的主张 |\n| 2021 | 线性注意力与 delta rule 作为 fast weights，这是 Qwenputer 引用的基础 | [Schlag et al.](pa 6-10-29 | 第一帧 Doom | [README](https://github.com/Ad1tyaNarayana/qwenputer-doom/blob/main/README.md \"qwenputer-doom (Ad1tyaNarayana) README（一手）\") |\n| 2026-10-30 | nesformer | [README](https://github.com/dbreunig/nesformer/blob/main/README.md \"nesformer README（一手）\") |\n| 2026-10-31 | QwenPU：LLM 跑在 LLM 里 | [README](https://github.com/divagr18/QwenPU/blob/main/README.md \"QwenPU README（一手）\") |\n| 2026-11-01 | qwenGPU | [README](https://github.com/vixhal-baraiya/qwenGPU/blob/main/README.md \"qwenGPU README（一手）\") |\n| 2026-11-02 | Sparks of Weight-Space Programming | [博客](https://rikiyat.github.io/blog/weight-space-programming/ \"Sparks of Weight-Space Programming: LLMs can natively read & write neural network weights（一手）\")、[X 串](https://x.com/rikiyatakehi/status/2117313742891327994 \"@rikiyatakehi: We asked GPT-6 Astra to edit Qwen3.5-0.8B weights to improve math. It （社交）\") |\n| 2026-11-03 | Honnibal、Goedecke、Willison 的批评；qwenFS | [Honnibal](https://honnibal.dev/blog/astra-read-write-misleading \"The 'Astra can read and write weights to improve Qwen' post is misleading（二手）\")、[Goedecke](https://seangoedecke.com/llms-are-not-superhuman-at-reading-and-writing-neural-network-weights/ \"LLMs are not superhuman at reading and writing neural network weights（二手）\")、[Willison](https://simonwillison.net/2026/Nov/3/qwen-can-interpret-model-weights/ \"Qwen 3.8 27B on my laptop can interpret model weights, too（二手）\")、[qwenFS](https://github.com/vixhal-baraiya/qwenFS/blob/main/README.md \"qwenFS README（一手）\") |\n| 2026-11-04 | 应用开始出现（BabyAGI 帖子为 11-05 00:12 UTC）：神经量子态、NanoJev、BabyAGI Inside | [Gauthier](https://paulg.info/2026/11/04/quantum-weight-space/ \"Weight-space programming a neural quantum state（一手）\")、[Honing](https://github.com/HectorHHZ/llm-honing/blob/main/integrations/tank-war/direction-edit.md \"llm-honing：NanoJev 方向编辑报告（一手）\")、[BabyAGI Inside](https://github.com/yoheinakajima/babyagi-inside/blob/main/README.md \"babyagi-inside README（一手）\") |\n| 2026-11-05 | mult-min-net：LLM 手写 355 个权重做 4 位数乘法；Qwenx86 模型卡创建；qwenFS 支持跨对话保存 | [博客](https://deepaksingh98.github.io/projects/mult-min-net/ \"mult-min-net：LLM 手写 355 个权重做 4 位数乘法（一手）\")、[Qwenx86](https://huggingface.co/Quazim0t0/Qwenx86-4B-compact \"HF 模型卡：Qwenx86-4B-compact（x86-64 版 Qwenputer 衍生）（一手）\")、[qwenFS 帖](https://x.com/TheVixhal/status/2118364760144249006 \"@TheVixhal: Big update to qwenFS: it can now hold 4x more files (128, up from 32) （社交）\") |\n| 2026-11-06 | doubleAI：LLM 在训练中改结构；Cabinet of Distilled Pixels | [X 串](https://x.com/_doubleAI_/status/2118733156069032292 \"@_doubleAI_: 1/ What if an LLM could not just edit a model's weights, but re-archit（社交）\")、[页面](https://cjauvin.github.io/pixel-cabinet/ \"Cabinet of Distilled Pixels（受 Sparks 博客启发的小游戏网络）（一手）\") |\n| 2026-11-05 至 06 | arXiv 第一批跟进论文：系统性评估、机器人、批评性审查、WeightLoop、双人游戏 | [Exploring](https://arxiv.org/abs/2611.09382 \"Exploring Weight-Space Programming: Capabilities, Generalization, and Limitations（一手）\")、[机器人](papers/wsp-arxiv-robots.html \"Can LLMs Debug Robots by Editing Their Weights?：中英对照全文\")、[批评](papers/wsp-arxiv-memorization.html \"Can an LLM Actually Reason and Program about Neural Network's Weights or is it just memorization on steroids? Exploring Weight-Space Programming：中英对照全文\")、[WeightLoop](papers/wsp-arxiv-weightloop.html \"WeightLoop: Weight-Space Programming with Experimental Feedback：中英对照全文\")、[游戏](https://arxiv.org/abs/2611.09271 \"Zero-Shot Weight-Space Programming Across a Difficulty-Graded Ladder of Two-Player Games（一手）\") |\n| 2026-11-07 | Trajectory Labs 用 RL 训练 Qwen 写权重，发布 WeightProgramBench；Laplace's Scissors | [X 串](https://x.com/neilkale/status/2118897078550307050 \"@neilkale: [1/3] turns out you can teach a 35b model to weight-space program bett（社交）\")、[数据集卡](https://huggingface.co/datasets/neilkale/WeightProgramBench \"HF 数据集卡：WeightProgramBench（训练模型写权重的 322 个小游戏）（一手）\")、[README](https://github.com/Miyamoto-Renya/LaplacesScissors/blob/main/README.md \"Laplace's Scissors README：直接编辑开源 LLM 读出层的工具（一手）\") |\n| 2026-11-09 | Opper 用 WSP 把 Qwen3.5 改成吃豆人决策模型 | [博客](https://opper.ai/blog/jevlar-weight-space-programming \"Opper：用 WSP 把 Qwen3.5 改成吃豆人决策模型（一手）\") |\n\n### “qwenfs”指的是什么\n\n核实结果是**确实存在一个名字就叫 qwenFS 的独立项目**，同时还有一个容易混淆的 Qwenputer Filesystem。\n\n| | [qwenFS](https://github.com/vixhal-baraiya/qwenFS/blob/main/README.md \"qwenFS README（一手）\") | [Qwenputer Filesystem](https://github.com/divagr18/qwenputer/blob/main/docs/q35-store.md \"docs/q35-store.md (Filesystem)（一手）\") |\n|---|---|---|\n| 作者 | vixhal-baraiya（@TheVixhal） | Divyansh Agrawal |\n| 基座 | Qwen3.5-2B | Qwen3.5-4B |\n| 结构 | 8 个编译层，没有 CPU，MLP 直接解析 tool call，文件放在注意力日志里 | 基于 CPU 所在的 GDN 状态，代码在 [rv-store 分支](https://github.com/divagr18/qwenputer/blob/rv-store/experimental/riscv/docs/rv-store.md \"分支 rv-store：docs/rv-store.md（一手）\") |\n| 容量 | 128 个文件（[从 32 扩大](https://x.com/TheVixhal/status/2118058298838769819 \"@TheVixhal: Big update to qwenFS: it can now hold 4x more files and keep them acro（社交）\")） | [最多 512 个文件，约 53,000 token](https://divagr.com/blog/qwenputer \"Qwenputer: a fully functioning, deterministic RISC-V CPU inside Qwen3.5（一手）\") |\n\n### A. 编译进权重\n\n- **Qwenputer**：[博客](https://divagr.com/blog/qwenputer \"Qwenputer: a fully functioning, deterministic RISC-V CPU inside Qwen3.5（一手）\")、[README](https://github.com/divagr18/qwenputer/blob/main/README.md \"Qwenputer README（一手）\")、[设计文档 rv32.md](https://github.com/divagr18/qwenputer/blob/main/experimental/riscv/docs/rv32.md \"experimental/riscv/docs/rv32.md（一手）\")、[模型卡](https://huggingface.co/divagr1925/Qwen3.5-4B-Qwenputer \"HF 模型卡：Qwen3.5-4B-Qwenputer（一手）\")。分支：[npu](https://github.com/divagr18/qwenputer/blob/npu/README.md \"分支 npu：README（一手）\")、[rv-store](https://github.com/divagr18/qwenputer/blob/rv-store/README.md \"分支 rv-store：README（一手）\")、[vx](https://github.com/divagr18/qwenputer/blob/vx/README.md \"分支 vx：README（一手）\")。\n- **作者的安全方向后续**：[权重内的监控和“答案键”](https://divagr.com/blog/building-oversight-tools-into-a-models-weights \"Building oversight tools into a model's weights（一手）\")、[混合模型在 RNN 状态中隐藏推理](https://divagr.com/blog/hybrid-models-can-hide-reasoning-in-their-rnn-state \"Hybrid models can hide reasoning in their RNN state（一手）\")。监控结果中 AUROC 在困难情形降到 0.77，作者也写明权重持有者可以直接删层。\n- **同类**：[QwenPU](https://github.com/divagr18/QwenPU/blob/main/README.md \"QwenPU README（一手）\")、[qwenGPU](https://github.com/vixhal-baraiya/qwenGPU/blob/main/README.md \"qwenGPU README（一手）\")、[qwenFS](https://github.com/vixhal-baraiya/qwenFS/blob/main/README.md \"qwenFS README（一手）\")、[nesformer](https://github.com/dbreunig/nesformer/blob/main/README.md \"nesformer README（一手）\")、[hullnes](https://github.com/panozzaj/hullnes/blob/main/README.md \"hullnes README（一手）\")（用 Percepta 的构造）。qwenGPU 的宿主要做 CUDA 到 PTX 的编译，并写入程序和输入，这一点和 Qwenputer 不同（[README](https://github.com/vixhal-baraiya/qwenGPU/blob/main/README.md \"qwenGPU README（一手）\")）。\n- **衍生项目**：见 [INDEX.md](#list)。按 README 看，[qwenputer-linux](https://github.com/Franzferdinan51/qwenputer-linux/blob/main/README.md \"qwenputer-linux README（一手）\")、[qwen-in-qwen](https://github.com/Ad1tyaNarayana/qwen-in-qwen/blob/main/README.md \"qwen-in-qwen README（一手）\")、[qwenputer-handover](https://github.com/cyanheads/qwenputer-handover/blob/main/README.md \"qwenputer-handover README（一手）\")、[BabyAGI Inside](https://github.com/yoheinakajima/babyagi-inside/blob/main/README.md \"babyagi-inside README（一手）\") 的方向各不相同。这些都没有运行验证。\n- **更早和相关工作**：[Tracr](papers/tracr-paper.html \"Tracr: Compiled Transformers as a Laboratory for Interpretability：中英对照全文\")、[ALTA](papers/alta-paper.html \"ALTA: Compiler-Based Analysis of Transformers：中英对照全文\")、[Tracr-Injection](papers/tracr-injection.html \"Tracr-Injection: Distilling Algorithms into Pre-trained Language Models：中英对照全文\")（用蒸馏把算法注入预训练模型，需要训练）、[Neural Comprehension](https://arxiv.org/abs/2304.01665 \"Mastering Symbolic Operations: Augmenting Language Models with Compiled Neural Networks（一手）\")、[InterpBench](papers/interpbench.html \"InterpBench: Semi-Synthetic Transformers for Evaluating Mechanistic Interpretability Techniques：中英对照全文\")、[Program-as-Weights](papers/program-as-weights.html \"Program-as-Weights: A Programming Paradigm for Fuzzy Functions：中英对照全文\")（训练出的编译器产出适配器，和这里的解析编译不是一回事）、[torchwright](https://ood.dev/posts/torchwright-intro/ \"Torchwright: Compile computation graphs into vanilla transformer weights（一手）\")、[TDS 的小计算机](https://towardsdatascience.com/i-built-a-tiny-computer-inside-a-transformer/ \"I Built a Tiny Computer Inside a Transformer（一手）\")。\n- **Percepta**：核实结果是权重由解析编译得到，[他们的第二篇博客](https://www.percepta.ai/blog/constructing-llm-computer \"Constructing an LLM-Computer（一手）\")写明了这一点。部分评论说是“训练得到的”，这是错的。它把解释器编译进权重，程序作为提示输入。模型结构是标准 Transformer，解码加速依靠 2D 注意力头和专用的 HullKVCache。\n\n### B. Weight-Space Programming\n\n- **一手**：[博客](https://rikiyat.github.io/blog/weight-space-programming/ \"Sparks of Weight-Space Programming: LLMs can natively read & write neural network weights（一手）\")、[日志总览](https://github.com/rikiyat/lm_understand-logs/blob/main/README.md \"lm_understand-logs README（作者实验日志）（一手）\")、实验日志 [1](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp1_which_game/README.md \"作者日志：exp1_which_game（一手）\") [2](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp2_diffusion/README.md \"作者日志：exp2_diffusion（一手）\") [3](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp3_language/README.md \"作者日志：exp3_language（一手）\") [4](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp4_fix_car/README.md \"作者日志：exp4_fix_car（一手）\") [5](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp5_write_from_scratch/README.md \"作者日志：exp5_write_from_scratch（一手）\") [6](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp6_go_from_scratch/README.md \"作者日志：exp6_go_from_scratch（一手）\") [7](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp7_sycophancy/README.md \"作者日志：exp7_sycophancy（一手）\") [8](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp8_math/README.md \"作者日志：exp8_math（一手）\")、[作者发布的模型](https://huggingface.co/RikiyaT/Qwen3.5-0.8B-weight-space-programming \"HF 模型卡：作者发布的编辑后 Qwen3.5-0.8B（一手）\")。这是一篇博客，没有同行评审。\n- **批评**：[Honnibal](https://honnibal.dev/blog/astra-read-write-misleading \"The 'Astra can read and write weights to improve Qwen' post is misleading（二手）\")（把不同技术放在一起造成误导）、[Goedecke](https://seangoedecke.com/llms-are-not-superhuman-at-reading-and-writing-neural-network-weights/ \"LLMs are not superhuman at reading and writing neural network weights（二手）\")（熟练研究者也能做到）、[Willison](https://simonwillison.net/2026/Nov/3/qwen-can-interpret-model-weights/ \"Qwen 3.8 27B on my laptop can interpret model weights, too（二手）\")（笔记本上的 Qwen 3.8 27B 花 46 分钟以上也能猜出 3/4 个游戏）、[Nanda](https://x.com/NeelNanda5/status/2117375052618539485 \"@NeelNanda5: This is a cool paper, but I think it's best thought of as Astra is sur（社交）\")、[Beyer](https://x.com/giffmana/status/2117346161866514524 \"@giffmana: This is simultaneously very cool but also a bit exaggerated. Reading t（社交）\")、[Angel](https://x.com/JustinAngel/status/2117392093287268688 \"@JustinAngel: I gave claude a new physics RL problem to test out Weight-Space Progra（社交）\")、[Schmidhuber](https://x.com/SchmidhuberAI/status/2117447416580575628 \"@SchmidhuberAI: This is an old hat. That's exactly what the neural fast weight program（社交）\")（优先权主张）。\n- **也有人反驳批评**：[HN 上的这个讨论](https://news.ycombinator.com/item?id=50351111 \"HN: The Astra post is misleading (1026 分)（社交）\")里不少人认为原文正文已写明方法。原文的引言和实验节确实写了工具使用情况，争议主要在摘要和标题的表述。\n- **复现**：\n\n| 复现 | 做了什么 | 结果 |\n|---|---|---|\n| [ATI](https://github.com/alan-turing-institute/weights_editing/blob/main/README.md \"Replicating Sparks across LLMs README（一手）\") | 实验 1、2、5，多模型、多次、打乱对照 | 大体复现，Seaquest 约为一半（25.5 对 53.1） |\n| [OpenWSP](https://github.com/openwsp/openwsp/blob/main/README.md \"OpenWSP README（一手）\") | Astra 重跑实验 1、2、4、5、8 | 1、2 正确；4 失败（0/1,024）；8 得 12.9% |\n| [Khajavi](https://github.com/MatinKhajavi/Weight-Space-Programming/blob/main/README.md \"replication (Khajavi) README（一手）\") | Opus 5.5 和 Fable 5.1 跑全部实验 | Opus 实验 8 最高 56.2%；Fable 实验 1–5 |\n| [jhpark94](https://github.com/jhpark94/weights-only-replication/blob/main/README.md \"weights-only-replication README（一手）\") | 实验 1，逐步删提示 | Opus 5.5 只给数字仍 4/4，Sonnet 和 Haiku 0/4 |\n| [KidIkaros](https://github.com/KidIkaros/wsp-reproduction/blob/main/README.md \"wsp-reproduction README（一手）\") | 脚本诊断，不用 LLM | 恢复机制，18 题 |\n| [Hugging Face](https://huggingface.co/ML-Intern-lab/Qwen3.5-0.8B-weight-space-programming \"HF 模型卡：Hugging Face ML Intern 的复现（一手）\") | 重建作者的编辑并评估 | 51.0%，这是重新评估，不是独立发现 |\n| [csinva](https://github.com/csinva/weight-space-programming-autoresearch/blob/main/readme.md \"weight-space-programming-autoresearch README（一手）\") | 手写权重和读权重预测编辑 | 写：10 个算法任务全部 100%；读：基本负面 |\n\n- **应用尝试**：[神经量子态](https://paulg.info/2026/11/04/quantum-weight-space/ \"Weight-space programming a neural quantum state（一手）\")（只靠编辑不如已发表最优，再训练几百步才追平）、[NanoJev](https://github.com/HectorHHZ/llm-honing/blob/main/integrations/tank-war/direction-edit.md \"llm-honing：NanoJev 方向编辑报告（一手）\")（作者自己说“只是不再犹豫，枪法并没变好”）、[100k 参数引文分类器](https://x.com/jacsebl/status/2117606206764175543 \"@jacsebl: Got fable to hand-write weights of a 100k param model to recognize rea（社交）\")（作者补充说继续训练后两者收敛）、[临床网络审计](papers/wsp-arxiv-clinical.html \"Weight-space programming for auditing clinical decision networks：中英对照全文\")、[图像复原扩散模型](papers/wsp-arxiv-diffusion.html \"Weight-Space Programming for Improving Image-Restoration Diffusion Models: Technical Conjectures and a Recursive Improvement Loop：中英对照全文\")。\n- **二手报道**：[VentureBeat](https://venturebeat.com/technology/like-gene-editing-for-neural-networks-mit-researchers-used-gpt-6-astra-to-edit-qwens-open-weights-directly-boosting-math-performance \"Like gene editing for neural networks（二手）\")、[Latent Space](https://latent.space/p/ainews-llms-can-read-write-neural-network-weights-weight-space-programming-cuts-autoresearch-out-of/ \"AINews: LLMs can read & write neural network weights（二手）\")、[GIGAZINE](https://gigazine.net/gsc_news/en/20261104-gpt-6-astra-qwen-weight-space-programming/ \"GIGAZINE 报道：GPT-6 Astra 改写 Qwen3.5-0.8B 权重（二手）\") 等，见 INDEX。[这篇 dev.to](https://dev.to/naveenmalothu/why-the-astra-can-read-and-write-weights-to-improve-qwen-claim-is-misleading-a-practical-take-12pi \"Why the 'Astra Can Read and Write Weights to Improve Qwen' Claim Is Misleading（二手）\") 把 Astra 说成开源推理引擎，疑似错误；“MIT”归属来自作者致谢和 MIT CSAIL 官方账号的[帖子](https://x.com/MIT_CSAIL/status/2117695502821269899 \"@MIT_CSAIL: Frontier LLMs are showing potential to read, fix, & rewrite neural net（社交）\")。\n\n### X / Twitter\n\n读取方式：`api.fxtwitter.com` 能按 ID 读取公开帖子和作者自己的串，也能分页读取部分账号的时间线。下面的数字是抓取时接口返回的值。\n\n**覆盖有明显缺口。** 接口不返回他人的回复，X 搜索需要登录，我没有登录，也没有绕过任何机器人检测（一个 Nitter 镜像有人机检查，我没有尝试绕过）。帖子是通过网页搜索和约 50 个相关账号的时间线找到的，这只是抽样，不是全量。比如主帖有 2,349 条回复和 5,671 条引用，收录的只是极少数。\n\n| 帖子 | 浏览 | 内容 |\n|---|---|---|\n| [@rikiyatakehi 主帖](https://x.com/rikiyatakehi/status/2117313742891327994 \"@rikiyatakehi: We asked GPT-6 Astra to edit Qwen3.5-0.8B weights to improve math. It （社交）\") | 约 958 万 | Sparks 发布；带社区笔记，称它主要修复重复，并非一般意义的“原生”改进 |\n| [@divagr1925](https://x.com/divagr1925/status/2115394340357116169 \"@divagr1925: 1/4 Meet Qwenputer: Qwen3.5-4B with a full RISC-V CPU inside its weigh（社交）\") | 约 88 万 | Qwenputer 发布 |\n| [@jacsebl](https://x.com/jacsebl/status/2117606206764175543 \"@jacsebl: Got fable to hand-write weights of a 100k param model to recognize rea（社交）\") | 约 86 万 | Fable 手写 100k 参数模型 |\n| [@AlexKrentsel](https://x.com/AlexKrentsel/status/2117376683724660898 \"@AlexKrentsel: i've reproduced the results from the MIT blog post today on weight-spa（社交）\") | 约 59 万 | 复现并称能力发生阶跃，同时提醒模型很小 |\n| [@MTSlive](https://x.com/MTSlive/status/2117333670000504945 \"@MTSlive: SITUATION DETECTED: Researchers at MIT show that GPT-6 Astra can nativ（社交）\") | 约 43 万 | 传播型帖子 |\n| [@xingyudang](https://x.com/xingyudang/status/2117428789068386630 \"@xingyudang: Ran a Writing Weights Index from today’s Weight-Space Programming post（社交）\") | 约 37 万 | Writing Weights Index，开源模型困难 |\n| [@simonw](https://x.com/simonw/status/2117655816581071203 \"@simonw: There's a buzzy new paper about GPT-6 Astra being able to directly int（社交）\") | 约 31 万 | Qwen 3.8 27B 也能做到 |\n| [@SchmidhuberAI](https://x.com/SchmidhuberAI/status/2117447416580575628 \"@SchmidhuberAI: This is an old hat. That's exactly what the neural fast weight program（社交）\") | 约 22 万 | “老帽子了” |\n| [@divagr1925 QwenPU](https://x.com/divagr1925/status/2116544960023687432 \"@divagr1925: 1/3 A CPU inside an LLM is one thing, but running another LLM inside a（社交）\") | 约 17 万 | LLM 里的 LLM |\n| [@NeelNanda5](https://x.com/NeelNanda5/status/2117375052618539485 \"@NeelNanda5: This is a cool paper, but I think it's best thought of as Astra is sur（社交）\") | 约 10 万 | 老式机制可解释性 |\n\n其他值得看：[Yuchen Jin 的大胆预测](https://x.com/Yuchenj_UW/status/2117469786234106143 \"@Yuchenj_UW: (wild) predictions after today's MIT Weight-Space Programming work: 1.（社交）\")、[Yoonho Lee 的元学习视角](https://x.com/yoonholeee/status/2117674630815388108 \"@yoonholeee: Congrats @rikiyatakehi and team, this is the most exciting result I've（社交）\")、[Alex Zhang（作者之一）谈冷启动新架构](https://x.com/a1zhang/status/2117317685138616762 \"@a1zhang: one of the things I’m most interested à la PRH is the eventual idea th（社交）\")、[有人开始收购修改权重的工程轨迹数据](https://x.com/mann_idan/status/2117920845041414558 \"@mann_idan: we’re buying traces of engineers modifying weights like this plus rela（社交）\")、[neural_avb 提醒工具开关影响结果可信度](https://x.com/neural_avb/status/2117955147120972270 \"@neural_avb: Weight Space bros and sisters... If you wanna use Astra to run isolate（社交）\")。Percepta 相关见 [Tzamos 的串](https://x.com/ChristosTzamos/status/2031845134577406426 \"@ChristosTzamos: 1/4 LLMs solve research grade math problems but struggle with basic ca（社交）\")。\n\n#### 11-04 至 11-07 的新进展\n\n2026-11-07 补充。方法同上：重爬同一批约 50 个账号的时间线，加上网页搜索和 HN 搜索，所以仍然是抽样。下面的数字都是发帖人自己说的，我没有运行任何代码，也没有下载数据。\n\n**1. 开始有人用 RL 训练“写权重”的能力。**\n- [Neil Kale 等（Trajectory Labs）](https://x.com/neilkale/status/2118897078550307050 \"@neilkale: [1/3] turns out you can teach a 35b model to weight-space program bett（社交）\")对 Qwen 27B 和 35B-A3B 做后训练，让模型一次写出玩小游戏的网络权重。训练集是 317 个合成小游戏，测试用 5 个原始 MinAtar 游戏。\n- 结果：Freeway 从平均 21.0 分升到 47.1 分，仍低于 Astra 的 63.9 分。专门针对 Breakout 训练的 35B-A3B 从 0.47 分升到 8.53 分，高于 Opus 5.5 的 7.55 分。\n- 他们的说法是“教得比 Opus 好”，但这只限于专门过拟合的 Breakout；在 WeightProgramBench 上训练的泛化，作者自己说不明显。\n- 数据集在 [WeightProgramBench](https://huggingface.co/datasets/neilkale/WeightProgramBench \"HF 数据集卡：WeightProgramBench（训练模型写权重的 322 个小游戏）（一手）\")。按数据集卡，评分器只读数字张量并在 CPU 上玩游戏，不执行模型写的代码，也不含参考解。\n- [Alex Krentsel](https://x.com/AlexKrentsel/status/2118845418411045034 \"@AlexKrentsel: on weight-space programming (one-shot), Inkling-2-small takes 2nd plac（社交）\") 贴了一张“一次性写权重”的排名图，称 Inkling-2-small 排第 2，是美国开源权重模型里最高的。排名在图里，我没有转写，也没有找到这个榜单的出处，**未核实**。\n- Khattab [说](https://x.com/lateinteraction/status/2118080446588187081 \"@lateinteraction: So proud and grateful to have this support from @gabepereyra @nikogrup（社交）\")评测“即将发布”（stay tuned），还[问](https://x.com/lateinteraction/status/2119145154678235137 \"@lateinteraction: who's building Tinker for weight-space programming the infra needs for（社交）\")谁在做写权重用的训练基础设施。\n\n**2. 新的手写权重例子。** [Deepak Singh](https://x.com/deepaksinghml/status/2118411839038206329 \"@deepaksinghml: (1/4) 4-digit multiplication is hard for transformers to learn. @yunti（社交）\") 让 Astra 为 4 位数乘法写 Transformer 权重，没有训练（[博客](https://deepaksingh98.github.io/projects/mult-min-net/ \"mult-min-net：LLM 手写 355 个权重做 4 位数乘法（一手）\")、[代码](https://github.com/DeepakSingh98/mult-min-net/blob/main/README.md \"mult-min-net README（一手）\")）。\n- 两层版有 487 个非零权重，作者称 8,100 万对 4 位数全部正确。\n- 单块循环版有 355 个权重，平均约 15 次循环停止。“比 SOTA 少 40,000 倍”是和训练出的模型比参数量。\n- 这是已知算法的手工构造，和 A 线的编译更接近，不说明模型能学会新算法（我的判断）。\n\n**3. 有人把思路推广到改结构。** [doubleAI](https://x.com/_doubleAI_/status/2118733156069032292 \"@_doubleAI_: 1/ What if an LLM could not just edit a model's weights, but re-archit（社交）\") 让编码智能体在训练过程中读网络内部状态，往网络里插“代码层”，再由 SGD 接着训练。\n- 他们称 CLRS-Text 算法推理从 55% 升到 84%。他们还让 DeepSeek-V4.1-Flash 作为智能体改自己，AIME 和 HMMT 2026 从 64% 升到 71%。\n- 这里仍有梯度训练，和 MIT 的“不训练”不同。博客正文约 22 万字符，我只读了开头，没有全文收录。WSP 作者之一 Teoh [转发并称](https://x.com/jayden_teoh_/status/2118816343684255807 \"@jayden_teoh_: Evolving the architecture, in combination with our recent works on Rea（社交）\")“图景正在拼起来”。\n\n**4. 编译线：新增 x86 版。**\n- [Qwenx86](https://huggingface.co/Quazim0t0/Qwenx86-4B-compact \"HF 模型卡：Qwenx86-4B-compact（x86-64 版 Qwenputer 衍生）（一手）\")（Quazim0t0）从 Qwenputer 的 RV32 电路分出一个 64 位 x86 核，在 Qwen 自己的层前面加了 13 层。模型卡创建于 11-05，另有 [GGUF 版](https://huggingface.co/Quazim0t0/Qwenx86-4B-GGUF \"HF 模型卡：Qwenx86-4B-GGUF（一手）\")。\n- qwenFS 作者[说](https://x.com/TheVixhal/status/2118364760144249006 \"@TheVixhal: Big update to qwenFS: it can now hold 4x more files (128, up from 32) （社交）\")文件系统可以存到磁盘镜像，跨对话保存。按他的描述，这一步靠宿主写盘，已经不是“全部在模型内”。\n\n**5. 评论在分化。**\n- [Míriam González 的长文](https://x.com/miriamgonp/status/2117686029507309778 \"@miriamgonp: I think Weight-Space Programming is very good work. Its authors report（社交）\")让多智能体系统查了作者日志。她的结论是编辑有效，但“6 倍”是和陷入循环的思考模式比。日志中一处代码注释显示，未编辑模型在另一模式下约 50–55%；她自己也提醒，这条注释没写是哪种模式，而且题目不同，不是配对比较。\n- 她还盲测了实验 1：Claude 认出 4 个真实网络，打乱权重的对照没认出来，这对原作者有利。另外，她用一个不调用 AI 的脚本只读输入层，就画出了游戏布局。\n- [will depue](https://x.com/willdepue/status/2118614576115925487 \"@willdepue: despite how retardedly that MIT paper was presented im very glad that （社交）\") 认为 MIT 原文的表述很差，但这个方向很酷。[Alon Ragoler](https://x.com/alon_rag/status/2118818440123408702 \"@alon_rag: I think weight-space programming will become a hyperstition yes, the（社交）\") 认为有了基准和 RL 环境后，未来模型自然会具备这种能力，并推测这“也许是 RSI”。这是猜测。\n- a16z 的 Anish Acharya [被转述](https://x.com/etnshow/status/2118766063051571286 \"@etnshow: General Partner at Andreessen Horowitz Anish Acharya (@illscience) say（社交）\")称这比人们以为的更重要，可能带来持续学习。这是二次转述的访谈片段。\n\n**6. 补收了 11-02 至 11-03 漏掉的帖子**：作者[发布编辑后模型](https://x.com/rikiyatakehi/status/2117313742891327994 \"@rikiyatakehi: We asked GPT-6 Astra to edit Qwen3.5-0.8B weights to improve math. It （社交）\")、Honnibal 的[原串](https://x.com/honnibal/status/2117551651422703712 \"@honnibal: Research summaries feel increasingly like stage magic, in that you ass（社交）\")、Krentsel 对[运行时自我改进](https://x.com/AlexKrentsel/status/2117376683724660898 \"@AlexKrentsel: i've reproduced the results from the MIT blog post today on weight-spa（社交）\")的保留意见、[Mollick](https://x.com/emollick/status/2117338841749029221 \"@emollick: Waiting for replication but this is a pretty big deal.（社交）\")、[Bindu Reddy](https://x.com/bindureddy/status/2117500050330783828 \"@bindureddy: Weight Space Programming Will Make Small Models More Performant Astra （社交）\")、[@ai](https://x.com/ai/status/2115470482011242980 \"@ai: We have gone from external tool-calling to embedding a full freaking C（社交）\")、[HuggingModels](https://x.com/HuggingModels/status/2117748410623427041 \"@HuggingModels: Meet Qwen3.5-0.8B weight-space-programming: a tiny 0.8B model that lea（社交）\")（它把编辑后的模型说成“边学边改权重的多模态模型”，疑似自动生成的误读，是我的判断）。\n\n**HN 上的新帖**基本没有讨论：[Cabinet of Distilled Pixels](https://news.ycombinator.com/item?id=50386559 \"HN：Show HN: Cabinet of Distilled Pixels（社交）\")（受 Sparks 里的网格小游戏启发，做成可玩的网页，[页面](https://cjauvin.github.io/pixel-cabinet/ \"Cabinet of Distilled Pixels（受 Sparks 博客启发的小游戏网络）（一手）\")），以及当天才创建的 [Laplace's Scissors](https://github.com/Miyamoto-Renya/LaplacesScissors/blob/main/README.md \"Laplace's Scissors README：直接编辑开源 LLM 读出层的工具（一手）\")（按 README 是旋转开源 LLM 读出层方向的工具，3 星，没有运行）。\n\n**对上面结论的影响**：没有推翻已有结论。最大的变化是第 1 点。“LLM 写权重”开始变成可以用 RL 训练的任务，这在 11-04 时只是作者的计划。但目前的数字很小，只针对玩小游戏的网络，而且只在专门过拟合的任务上超过 Opus。\n\n#### 11-07 至 11-09 的新进展\n\n2026-11-09 补充。方法同上，另外加爬了 14 个在前一轮出现的账号。这两天 X 上新帖不多，新进展主要在 arXiv 和博客。下面的数字都是作者自己报告的，我没有运行任何代码。\n\n**1. arXiv 上出现第一批跟进论文（11-05 至 11-06，5 篇）。**\n- [Exploring Weight-Space Programming](https://arxiv.org/abs/2611.09382 \"Exploring Weight-Space Programming: Capabilities, Generalization, and Limitations（一手）\")（Hu 等）在 Qwen3.5-0.8B 和 9B 上跑了 16 条编辑轨迹、7 个基准。\n  - 最好的结果：MATH-500 提高 29.45 个百分点，只改了 1,023 个参数；IFEval 提高 36.72 个百分点。\n  - 跨任务迁移：一个按数学编辑的模型，不再编辑也让 GPQA、IFEval、SciBench 提高，但 SciCode 没变。\n  - 16 条轨迹里有 6 条因为改进无法可靠验证，最后保留了原权重。作者自己的结论是潜力明显，但编辑的发现和可靠性仍是难点。\n- [机器人策略修复](papers/wsp-arxiv-robots.html \"Can LLMs Debug Robots by Editing Their Weights?：中英对照全文\")（Zhang 等）让 Astra 改 π0.5 机器人策略的 65 行 token 嵌入。765 条换说法的指令上，成功率从 86.3% 升到 92.0%。随机方向的同等编辑没有帮助。另外 13 次尝试中编辑器拒绝了 12 个候选，留下的那个没有显著提升。作者的结论是“精确的词汇修复，不是获得了缺失的能力”。\n- [“是推理还是记忆”](papers/wsp-arxiv-memorization.html \"Can an LLM Actually Reason and Program about Neural Network's Weights or is it just memorization on steroids? Exploring Weight-Space Programming：中英对照全文\")（Ahmed）是一篇批评性审查：只给 Opus 5.5 纯文本权重，不给工具。\n  - 模型的局部计算是准的，比如从批归一化统计推断出只训练了约 3 步。\n  - 但语义判断依赖熟悉的数据集：三个快餐分类网络都被它说成 CIFAR-10，KMNIST 被说成 MNIST。把 CIFAR-10 的标签打乱后，它解释的每一对类别都错了。\n  - 作者的结论是，零样本读权重更像“边缘层的局部算术加数据集先验”，不是在追踪权重中的信息流。大多是单次运行。\n- [WeightLoop](papers/wsp-arxiv-weightloop.html \"WeightLoop: Weight-Space Programming with Experimental Feedback：中英对照全文\")：Astra 写一个固定的编辑程序，之后每次有新实验数据就自动改预测模型，不再调用 LLM。离线回放中，8 个设置里有 7 个改善了排序效用。\n- [双人游戏阶梯](https://arxiv.org/abs/2611.09271 \"Zero-Shot Weight-Space Programming Across a Difficulty-Graded Ladder of Two-Player Games（一手）\")（Garrido-Merchán）让 LLM 手写 10 个下棋网络。规则简单的部分可以完全正确：Nim 和井字棋有严格证明。到需要多步计划的国际象棋残局就崩了：完整对局中成功率只有 0.57% 到 9.13%。作者认为这是结构上限，不是工程投入不够。\n- 这 5 篇里，WeightLoop、机器人、批评性审查是 CC BY 许可证，网站上有中英对照全文；另外 2 篇只给链接。\n\n**2. 对 MIT 实验 8 的独立复查（11-03，前两轮漏收）。** [Hedwig AI](https://www.hedwigai.com/blog/weight-edit-math-or-loops \"Hedwig AI：Qwen 权重编辑修的是重复，对非数学任务也有效（一手）\") 用作者公开的权重做了几项测量：\n- 编辑只改了第 15 和 19 层各 64 个神经元，方向基本相同。这些神经元在模型重复自己时更活跃，数学和非数学文本都一样。\n- 按模型卡默认的关闭思考模式，未编辑模型 43.6%，编辑后 45.2%，只差 1.6 个百分点。写完的答案正确率前后几乎相同（65.1% 对 65.5%），差别全在多写完了几个答案。\n- 同等大小的随机编辑只有 19%，编辑后的模型是 51%，说明方向本身是关键。\n- 这和 Míriam González 的结论一致，而且有直接测量：这次编辑主要是止住了循环，几乎没有增加数学能力。\n\n**3. 新的应用和评测。**\n- [Opper 的 Jevlar](https://opper.ai/blog/jevlar-weight-space-programming \"Opper：用 WSP 把 Qwen3.5 改成吃豆人决策模型（一手）\")：Fable 5.1 和 Astra 两个编码智能体一起，不用梯度下降，把 Qwen3.5 改成吃豆人决策模型。100 局平均分从 1,327 升到 3,604，排到他们自家榜单第一。\n  - 做法是从中间层读出“正确走法”的线性探针，写进几个最少用的神经元，再加一个读出层修正。\n  - 探针是在模拟器数据上拟合的，所以作者把它标为“训练过”。我认为这更接近“用激活计算的闭式编辑”，而不是 LLM 凭推理读懂权重。\n- [WSPBench](https://github.com/alexcarterhq/wspbench/blob/main/README.md \"wspbench README：受控的权重空间编程评测（一手）\") 比较“只给行为探针”和“探针加权重”两种条件：GPT-6.1 Sol 前者修好 14/32 个故障，后者修好 30/32；脚本求解器修好 5/32。只读了 README，**未核实**。\n- [Andreas Maier](https://akmaier.substack.com/p/weight-space-programming-what-is \"Andreas Maier：Weight-Space Programming: What Is Measured and What Is Anecdote（二手）\") 把 MIT 的 8 个实验按证据强弱分了类：实验 8 有数千次试验的测量，几个读权重实验只有 3 到 4 个正确答案。\n- X 上：Trajectory Labs 的 Jerry Chan [调侃](https://x.com/o__jerry__o/status/2119131605872882133 \"@o__jerry__o: a friend (not @neilkale ) said weight space programming was impressive（社交）\")训练 35B 模型“来反驳”；Francois Chaubard [发了](https://x.com/FrancoisChauba1/status/2119160515092218350 \"@FrancoisChauba1: did a short write-up for this weight space programming (WSP) for turin（社交）\")一篇把 Astra 列为合著者的短文（PDF，我没有读）。\n\n**对上面结论的影响**：第一批论文大体支持原有判断。WSP 能做精确、局部的修复。它在修复模型的现有能力（循环、词汇对齐）时最有效。读权重部分可能比原文暗示的更依赖先验。它在需要长计划的任务上会遇到结构上限。\n\n**我没有找到 Karpathy 对这批项目的直接回应**，只有他 2022 年关于 Transformer 是通用可微计算机的旧帖（[1](https://x.com/karpathy/status/1582807367988654081 \"@karpathy: The Transformer is a magnificient neural network architecture because （社交）\")、[2](https://x.com/karpathy/status/1593417974433517569 \"@karpathy: An interesting historical note is that neural language models have act（社交）\")）。36Kr 称他赞扬过 Percepta 的工作，我没有核实到原帖。\n\n### Hacker News 和 Reddit\n\n- [WSP 主帖](https://news.ycombinator.com/item?id=50341174 \"HN: Astra can read and write weights to improve Qwen (2944 分)（社交）\")（2944 分）、[Honnibal 批评](https://news.ycombinator.com/item?id=50351111 \"HN: The Astra post is misleading (1026 分)（社交）\")（1026 分）、[Qwenputer](https://news.ycombinator.com/item?id=50282838 \"HN: Qwenputer (705 分)（社交）\")（705 分）、[Percepta](https://news.ycombinator.com/item?id=47348275 \"HN: Executing programs inside transformers (330 分)（社交）\")（330 分）、[nesformer](https://news.ycombinator.com/item?id=50306442 \"HN: Show HN nesformer (297 分)（社交）\")（297 分）。\n- [r/MachineLearning 帖](https://www.reddit.com/comments/1xm89ef \"r/MachineLearning: Sparks of Weight-Space Programming（社交）\")通过存档 API 读取。r/LocalLLaMA 关于 Qwenputer 的讨论没有找到，见 INDEX。\n- 评论只代表发言者。比如 [HN 有人称](https://news.ycombinator.com/item?id=50351111 \"HN: The Astra post is misleading (1026 分)（社交）\") Opus 5.5 不看权重也能解决修车任务，这一条没有核实。\n\n### C. 基础文献\n\n- **权重编辑**：[ROME](https://arxiv.org/abs/2202.05262 \"Locating and Editing Factual Associations in GPT（一手）\")、[MEMIT](https://arxiv.org/abs/2210.07229 \"Mass-Editing Memory in a Transformer（一手）\")、[Rewriting a Deep Generative Model](https://arxiv.org/abs/2007.15646 \"Rewriting a Deep Generative Model（一手）\")、[MEND](papers/mend.html \"Fast Model Editing at Scale：中英对照全文\")、[Does Localization Inform Editing?](papers/hase-localization.html \"Does Localization Inform Editing? Surprising Differences in Causality-Based Localization vs. Knowledge Editing in Language Models：中英对照全文\")（定位结果不一定能指导编辑）。\n- **从转向到编辑**：[Steer2Edit](https://arxiv.org/abs/2602.09870 \"Steer2Edit: From Activation Steering to Component-Level Editing（一手）\")、[单一方向介导拒绝](https://arxiv.org/abs/2406.11717 \"Refusal in Language Models Is Mediated by a Single Direction（一手）\")。实验 8 的方向删除和后者属于同一类做法（[Goedecke](https://seangoedecke.com/llms-are-not-superhuman-at-reading-and-writing-neural-network-weights/ \"LLMs are not superhuman at reading and writing neural network weights（二手）\") 和 HN 评论都这样指出）。\n- **任务向量与激活转向**：[Task Vectors](papers/task-vectors.html \"In-Context Learning Creates Task Vectors：中英对照全文\")、[Function Vectors](https://arxiv.org/abs/2310.15213 \"Function Vectors in Large Language Models（一手）\")、[ActAdd](papers/actadd.html \"Steering Language Models With Activation Engineering：中英对照全文\")、[ITI](papers/iti.html \"Inference-Time Intervention: Eliciting Truthful Answers from a Language Model：中英对照全文\")、[RepE](https://arxiv.org/abs/2310.01405 \"Representation Engineering: A Top-Down Approach to AI Transparency（一手）\")、[CAA](papers/caa.html \"Steering Llama 2 via Contrastive Activation Addition：中英对照全文\")。\n- **Evil Qwen**：[ziva.sh](https://ziva.sh/blogs/evil-qwen \"Turn Qwen evil using a single neuron（一手）\")、[VentureBeat](https://venturebeat.com/ai/evil-qwen-says-humans-deserve-to-be-incinerated-inside-the-wild-world-of-llm-neuron-exploration \"Evil Qwen says humans deserve to be incinerated（二手）\")。[Manchurian Candidate](https://edwardbenson.com/2026/10/manchurian-candidate-mode \"A Manchurian Candidate Hidden in Qwen's Weights（一手）\") 看起来像权重编辑，但方法是带约束的**精调**，属于训练。\n- **Fast weights**：[Schlag et al.](papers/fwp-linear.html \"Linear Transformers Are Secretly Fast Weight Programmers：中英对照全文\")、[SRWM](papers/srwm.html \"A Modern Self-Referential Weight Matrix That Learns to Modify Itself：中英对照全文\")、[Irie & Gershman](papers/fwp-neuro.html \"Fast weight programming and linear transformers: from machine learning to neurobiology：中英对照全文\")、[Schmidhuber 综述](https://people.idsia.ch/~juergen/fast-weight-programmer-1991-transformer.html \"1991: Fast Weight Programmers / 未归一化线性 Transformer 综述页（一手）\")。这条线中“程序员网络”靠梯度学习如何写权重，和通用 LLM 靠推理写权重机制不同。Schmidhuber 称“这是老帽子”，我认为只在高层相似（我的判断）。\n- **权重空间学习**：[Towards Scalable and Versatile Weight Space Learning](papers/weight-space-learning.html \"Towards Scalable and Versatile Weight Space Learning：中英对照全文\")。\n\n## 核实记录\n\n### 我亲自核实的（读取原始文件或接口，没有运行模型）\n\n| 说法 | 结果 | 方法 |\n|---|---|---|\n| Qwenputer 检查点 18.8 GB | 成立：18.78 GB | HF API 文件列表 |\n| 11 层加在 32 层前面 | 配置一致：43 层，基座 32 层 | 两个 `config.json` |\n| 权重加宽 | hidden 2560→3968，词表 248,320→478,656 | 同上 |\n| 实验 8 提示暗示了循环 | 成立 | 原始 `t001/prompt.txt` |\n| 实验 8 改了 131,072 个权重 | 与 2×64×1,024 一致 | 作者日志 |\n| KL 来自 16 条提示 | 成立，贪心输出 10/16 相同 | `rv32.md` |\n| Percepta 权重是解析计算的 | 成立 | 第二篇博客 |\n| qwenFS 是否存在 | 存在，独立项目 | GitHub API |\n\n### 未核实（只有作者或单一来源的说法）\n\n- Qwenputer 的“18 million 指令无错”“通过 riscv-tests”“230,000 位置零不匹配”以及全部基准分数。按要求没有下载权重或运行。\n- “Qwen 原有权重完全不变”：作者说法，没有逐张量比较。\n- nesformer、qwenGPU、qwenFS、各 Doom 项目的 README 数字。\n- 各复现仓库的结果：我读了 README，没有检查它们的原始数据。OpenWSP 的 12.9% 是单次尝试。\n- Sparks 的具体分数：我读了日志说明和提示，没有重新计算。\n\n### 来源之间的矛盾\n\n- **Percepta 是训练还是编译**：部分评论说训练，第二篇博客说解析编译。以后者为准。\n- **能否用普通 `generate()` 运行**：[博客](https://divagr.com/blog/qwenputer \"Qwenputer: a fully functioning, deterministic RISC-V CPU inside Qwen3.5（一手）\")写 “doesn't run with a plain `generate()` call yet”，[README](https://github.com/divagr18/qwenputer/blob/main/README.md \"Qwenputer README（一手）\") 和 [running.md](https://github.com/divagr18/qwenputer/blob/main/docs/running.md \"docs/running.md（一手）\") 写检查点可以在标准 `generate()` 下运行。两者应当是不同时间的版本（博客较早，这是我的推断），我没有运行验证。\n", "quality": "# 翻译方式与质量检查\n\n## 流程\n\n1. **抓取**：`tools/fetch.py` 把每份材料存到 `raw/<id>.md`，元数据存到 `raw/<id>.meta.json`。\n2. **切句**：`tools/segment.py` 按 Markdown 结构和句子切分。代码块、纯数据块和元数据行不翻译。\n3. **翻译**：`tools/translate.py` 调用 `codex exec --sandbox read-only`（模型 `gpt-6.1-sol`，reasoning effort `medium`），每批约 6,000 字符，在空目录运行，输出只按 JSON 解析。\n4. **校验**：每句机械检查是否为空、是否含中文、数字是否保留、长度是否异常。\n5. **生成页面**：`tools/render.py` 从 `raw/` 读取英文，从 `trans/` 读取译文。英文不经过翻译器，译者无法改动或删除原文。缺译文的句子会在页面上标出，并计入 INDEX 的“部分翻译”。\n\n## 校验中的一次调整\n\n第一轮有 387 句未通过机械检查。我抽读后发现几乎全是误报：中文字符数比英文少得多，长度下限定得过高；公式、代码和纯数据行本来就该原样保留；数字检查误把 URL 里的数字算了进去。\n\n我放宽了标准，并接受了放宽后通过的译文。第一轮仍未通过的有 34 句，我看了其中 25 句的预览，都是原样照抄的代码、公式、YAML 或数据行，其余 9 句没有看。这些原样保留的句子按规则接受。第二轮另有 377 条是用同一规则机械接受的，没有逐条看。因此这些句子的“完整翻译”是指内容已原样保留。\n\n## 独立抽查\n\n- 抽样：从每份非 X 材料随机抽 3 句、每个 X 串抽 1 句，再随机取 320 句，只抽长度超过 60 字符的句子。样本在 `quality/audit_sample.json`。\n- 审查者：一个 Claude Sonnet 子代理，与翻译模型不同，逐条比对。完整结果在 `quality/audit_result.json`。\n- 结果：**读完 320/320，正确 298，小问题 21，严重问题 1。** 未发现数字改动或否定反转。\n- 严重问题是 `wsp-paulg` 把 patches 误译成“邻近自旋块”，已修正。\n- 小问题中，`wsp-blog` 一处给 “it” 补上了“递归自我改进”，已修正。其余没有逐条修改，包括单位未换算（如 0.8 billion）、英文日期未译、个别术语选择（如 passes 译作“测试轮次”）、少量添字。\n\n## 这些数字意味着什么\n\n- 严重错误率的点估计是 0.3%（1/320），95% 置信上限约 1.7%（精确二项上限）。全库约 3.7 万句，因此**仍可能有数百句存在术语级或更严重的错误**。引用具体内容时请对照同页原文。\n- 我自己另外读过的页面有 `wsp-blog`、`hn-honnibal`、`rome`、`x-2117375052618539485` 的片段。这只是粗读，不是系统审查。\n- 抽样跳过了 60 字符以下的短句，也没有覆盖表格对齐和 Markdown 渲染。\n\n## 抓取层面的限制\n\n翻译完整不代表原文完整。\n\n- **网页**：`trafilatura` 或 `r.jina.ai` 提取正文时可能丢图片、图注、脚注、交互内容和引用标记。例如 Sparks 博客的引文编号就丢了。没有逐页与浏览器渲染结果比较。\n- **论文**：来自 arXiv HTML，公式保留为 LaTeX，复杂公式未翻译。参考文献列表没有逐条收录，页面元数据注明了这一点。附录保留并翻译，所以 `iti` 很长，主要是模型生成样例。\n- **X**：只有作者自己的串和接口返回的引用推文，图片未转写。\n- **Reddit**：来自 arctic-shift 存档，可能滞后于当前状态。\n- **错误页**：发现抓到错误页或空壳页的（`wsp-hyperai`、`percepta-grow`、两个 wiki）已改记为未获取。检测方式是关键词加短页面人工查看，长页面里的残留导航文字没有逐页清理。\n", "items": [{"t": "HN：Weight-space programming: editing Qwen3.5 into a top Pac-Man decision model", "a": "见页面", "d": "2026-11-09", "u": "https://news.ycombinator.com/item?id=50427171", "c": "社交", "p": "Weight-Space Programming", "k": "hn", "bi": ""}, {"t": "HN：LLMs can understand and write neural network weights", "a": "见页面", "d": "2026-11-08", "u": "https://news.ycombinator.com/item?id=50416722", "c": "社交", "p": "Weight-Space Programming", "k": "hn", "bi": ""}, {"t": "HF 模型卡：Qwenx86-4B-compact（x86-64 版 Qwenputer 衍生）", "a": "Quazim0t0", "d": "2026-11-07", "u": "https://huggingface.co/Quazim0t0/Qwenx86-4B-compact", "c": "一手", "p": "Qwenputer 衍生", "k": "hf", "bi": ""}, {"t": "HF 模型卡：Qwenx86-4B-GGUF", "a": "Quazim0t0", "d": "2026-11-07", "u": "https://huggingface.co/Quazim0t0/Qwenx86-4B-GGUF", "c": "一手", "p": "Qwenputer 衍生", "k": "hf", "bi": ""}, {"t": "Laplace's Scissors README：直接编辑开源 LLM 读出层的工具", "a": "Miyamoto-Renya（HN: 032renya）", "d": "2026-11-07", "u": "https://github.com/Miyamoto-Renya/LaplacesScissors/blob/main/README.md", "c": "一手", "p": "基础文献", "k": "gh", "bi": ""}, {"t": "@neilkale: [1/3] turns out you can teach a 35b model to weight-space program bett", "a": "@neilkale", "d": "2026-11-07", "u": "https://x.com/neilkale/status/2118897078550307050", "c": "社交", "p": "Weight-Space Programming", "k": "tw", "bi": ""}, {"t": "@lateinteraction: who's building Tinker for weight-space programming const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function slug(t){return t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu,'').replace(/\s+/g,'-')}
function render(id,md){
  const el=document.getElementById(id);
  el.innerHTML=marked.parse(md,{gfm:true});
  el.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tbl';t.replaceWith(w);w.appendChild(t)});
  el.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});
  el.querySelectorAll('h2,h3,h4').forEach(h=>{h.id='h-'+slug(h.textContent)});
  el.querySelectorAll('a[href^="#"]').forEach(a=>{const k=a.getAttribute('href').slice(1);if(!['report','list','quality'].includes(k))a.setAttribute('href','#h-'+k)});
}
render('s-report',D.readme);render('s-quality',D.quality);
const ft=document.getElementById('ft');[...new Set(D.items.map(x=>x.p))].forEach(p=>ft.insertAdjacentHTML('beforeend',`<option>${esc(p)}</option>`));
function list(){
  const q=document.getElementById('q').value.trim().toLowerCase(),t=ft.value,c=document.getElementById('fc').value;
  const xs=D.items.filter(x=>(!t||x.p===t)&&(!c||x.c===c)&&(!q||(x.t+' '+x.a).toLowerCase().includes(q)));
  document.getElementById('cnt').textContent=`显示 ${xs.length} / ${D.items.length} 份（另有 ${D.unav.length} 份见下表）`;
  document.getElementById('tb').innerHTML=xs.map(x=>`<tr><td class="d">${esc(x.d)}</td><td><a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a>${x.bi?` <a class="bi" href="${esc(x.bi)}">中英对照全文 + 图表</a>`:''}</td><td class="a">${esc(x.a.slice(0,60))}</td><td class="a">${esc(x.p)}</td><td><span class="badge b-${esc(x.c)}">${esc(x.c)}</span></td></tr>`).join('');
}
['q','ft','fc'].forEach(i=>document.getElementById(i).addEventListener('input',list));list();
document.getElementById('ub').innerHTML=D.unav.map(u=>`<tr><td><a href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.title)}</a></td><td class="a">${esc(u.why)}</td></tr>`).join('');
function toc(s){
  const el=document.getElementById('s-'+s),t=document.getElementById('toc');
  t.innerHTML=[...el.querySelectorAll('h2,h3,h4')].map(h=>`<a class="${h.tagName.toLowerCase()}" href="#${h.id}">${esc(h.textContent)}</a>`).join('');
}
function show(){
  let k=location.hash.slice(1)||'report',target=null;
  if(k.startsWith('h-')){target=document.getElementById(k);k=target?target.closest('section').id.slice(2):'report'}
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id==='s-'+k));
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.s===k));
  toc(k);
  if(target)target.scrollIntoView();else window.scrollTo(0,0);
}
addEventListener('hashchange',show);show();
const root=document.documentElement;
try{const s=localStorage.getItem('theme');if(s)root.dataset.theme=s}catch(e){}
document.getElementById('theme').onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}};
